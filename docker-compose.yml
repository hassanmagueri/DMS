services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms
      POSTGRES_DB: dms
    volumes:
      - dms-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://dms:dms@postgres:5432/dms?schema=public
      JWT_SECRET: dev-change-this-secret
      PORT: "4000"
      CORS_ORIGIN: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      PAYMENT_PROVIDER: mock
      PAYMENT_WEBHOOK_SECRET: dev-mock-webhook-secret
      PAYMENT_CURRENCY: MAD
      DEV_SKIP_EMAIL: dev@dms.io
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  dms-data:
